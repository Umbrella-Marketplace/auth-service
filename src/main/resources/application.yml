spring:
  application:
    name: auth-service

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: auth-service

  kafka:
    bootstrap-servers: kafka:9092

server:
  port: 8080

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: WARN
    org.mongodb.driver: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: "market-auth-service"
    expiration-ms: 3600000
